name: DashMap
options:
  bundleIdPrefix: com.dashmap
  deploymentTarget:
    iOS: "17.0"
packages:
  DashMapCore:
    path: Packages/DashMapCore
targets:
  DashMap:
    type: application
    platform: iOS
    sources: [DashMap, Shared]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.dashmap.DashMap
    dependencies:
      - target: DashMapWidgets
      - package: DashMapCore
    info:
      path: DashMap/Info.plist
      properties:
        CFBundleDisplayName: DashMap
        NSLocationWhenInUseUsageDescription: DashMap uses your location to guide you to your destination.
        NSLocationAlwaysAndWhenInUseUsageDescription: DashMap keeps guiding you while the screen is off or another app is in front.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [location, audio]
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  DashMapWidgets:
    type: app-extension
    platform: iOS
    sources: [DashMapWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dashmap.DashMap.Widgets
    info:
      path: DashMapWidgets/Info.plist
      properties:
        CFBundleDisplayName: DashMap
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
