name: DashMap
options:
  bundleIdPrefix: com.dashmap
  deploymentTarget:
    iOS: "16.0"
packages:
  DashMapCore:
    path: Packages/DashMapCore
targets:
  DashMap:
    type: application
    platform: iOS
    sources: [DashMap]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: DashMapCore
    info:
      path: DashMap/Info.plist
      properties:
        CFBundleDisplayName: DashMap
        NSLocationWhenInUseUsageDescription: DashMap uses your location to guide you to your destination.
        NSLocationAlwaysAndWhenInUseUsageDescription: DashMap keeps guiding you while the screen is off or another app is in front.
        UIBackgroundModes: [location, audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
